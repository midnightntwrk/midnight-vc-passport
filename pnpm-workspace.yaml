packages:
  - "packages/*"

# Supply-chain hardening (matches midnight-did):
# - block exotic-URL subdependencies (git/tarball/http resolvers in the graph)
# - minimum release age of 10080 minutes (7 days) before a version is installable
# - no-downgrade trust policy for registry attestations
# Exemptions must be listed explicitly below so every one is a reviewable diff.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  [
    # Renovate security update: pnpm@10.34.5
    pnpm@10.34.5
  ]
trustPolicyExclude: []

# Advisory-driven transitive override: GHSA-2v37-7h3g-55p8 (high) is patched in
# nanoid 3.3.18, but the lockfile had pinned 3.3.17 (resolved while 3.3.18 was
# still inside the minimumReleaseAge window) and pnpm update no-ops on an
# already-satisfying lockfile. 3.3.18 carries npm provenance attestations like
# 3.3.17. Dev-tooling scope only (postcss/vite chain); the publishable
# manifest's registry-clean dependency policy is unaffected.
overrides:
  nanoid: 3.3.18

# Declared (reviewed) build-script allowances: pnpm skips the install scripts
# of these otherwise-silent dependencies instead of executing them.
ignoredBuiltDependencies:
  - esbuild
  - unrs-resolver
