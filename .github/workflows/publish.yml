name: Publish

# The release train for the digital-passport family package (npm-publication
# spec). Manually dispatched only — no push, pull_request, or schedule trigger
# may ever start a publication. The channel/branch gate runs first and fails
# the run before any build step:
#   - snapshot:  develop only
#   - rc:        develop or main
#   - release:   main only
#
# npmjs is the only distribution channel, and publication is mandatory: a
# green run means the version is Verified (see CONTEXT.md). The step ids
# encode the outcome the always-run summary reports:
#   publish        fails → Rejected (npm publish is invoked once, never retried)
#   converge       fails → Accepted, propagation timed out (300s / 30s gate)
#   dist-tags      ┐
#   registry-test  ┘ fails → Visible, verification failed
#   all succeed          → Verified
# Every step after publish runs only when the previous steps succeeded (the
# GitHub default); nothing is best-effort. Retry guidance lives in
# docs/guides/npmjs-publication.md.
#
# Authentication is npm Trusted Publishing: the publish job runs inside the
# protected `npm-release` GitHub environment with `id-token: write`; npm
# (>= 11.5.1) exchanges the GitHub Actions OIDC token for a short-lived
# publish token when the npmjs-side Trusted Publisher mapping matches
# (organization midnightntwrk, repository midnight-vc-passport,
# workflow filename publish.yml, environment npm-release).
# No npm token secret exists — see docs/guides/npmjs-publication.md for the
# trusted-publisher prerequisites. The workflow filename must stay
# `publish.yml`: it is part of the npmjs Trusted Publisher mapping.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - snapshot
          - rc
          - release
        required: true
      version:
        description: "Base semantic version; must match the root and package manifests (optional confirmation)"
        type: string
        required: false
      rc_index:
        description: "Release candidate index (rc channel only; defaults to 1)"
        type: string
        required: false

# Least privilege: contents: read for the checkout, id-token: write for the
# npm trusted-publishing OIDC identity and the provenance signer.
permissions:
  contents: read
  id-token: write

# A publication must never be cancelled mid-flight by a newer dispatch.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPACT_COMPILER_VERSION: 0.31.1
  NPM_REGISTRY: https://registry.npmjs.org/
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"

jobs:
  publish:
    name: Gate, pack, publish to npmjs, and verify
    runs-on: ubuntu-24.04
    # Human gate + branch allow-list for the trusted-publishing identity.
    environment: npm-release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # npm trusted-publishing OIDC identity + provenance signer
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve publication context (dispatch-only, channel/branch gate)
        id: context
        env:
          # Free-form workflow_dispatch inputs must never be interpolated into
          # the run: script via ${{ }} (shell-injection risk); env values are
          # never parsed as shell syntax.
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_RC_INDEX: ${{ inputs.rc_index }}
        run: bash tooling/scripts/release-resolve-context.sh --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION" --rc-index "$RELEASE_RC_INDEX"

      - name: Set up Node.js, pnpm, and Compact
        uses: ./.github/actions/setup-node-pnpm
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}
          github-token: ${{ github.token }}
          registry-url: ${{ env.NPM_REGISTRY }}

      - name: Check the npm CLI supports trusted publishing (OIDC path)
        run: |
          npm --version
          node -e 'const v = require("child_process").execSync("npm --version").toString().trim(); const m = /^(\d+)\.(\d+)\.(\d+)/.exec(v); const p = m ? m.slice(1).map(Number) : [0, 0, 0]; const tooOld = p[0] < 11 || (p[0] === 11 && p[1] < 5) || (p[0] === 11 && p[1] === 5 && p[2] < 1); if (!m || tooOld) { throw new Error("npm " + v + " predates trusted-publishing support (needs >= 11.5.1)"); } console.log("npm CLI " + v + " supports trusted publishing");'

      - name: Run the repository gate (security checks, lint, typecheck, build, tests, release tooling)
        run: pnpm run all

      - name: Run the consumer smoke round-trip
        run: pnpm run smoke

      - name: Prepare the release version (stateless; never committed back)
        id: version
        env:
          # Outputs flow through env (never ${{ }} inside run:) so no future
          # validator regression can turn them into shell syntax.
          RELEASE_CHANNEL: ${{ steps.context.outputs.channel }}
          RELEASE_RC_INDEX: ${{ steps.context.outputs.rc-index }}
          RELEASE_BASE_VERSION: ${{ steps.context.outputs.base-version }}
        run: |
          ARGS=(--channel "$RELEASE_CHANNEL")
          if [ -n "$RELEASE_RC_INDEX" ]; then
            ARGS+=(--rc-index "$RELEASE_RC_INDEX")
          fi
          if [ -n "$RELEASE_BASE_VERSION" ]; then
            ARGS+=(--version "$RELEASE_BASE_VERSION")
          fi
          node tooling/scripts/prepare-release-version.mjs "${ARGS[@]}"

      # Emits the machine-readable contract report into tooling/artifacts/ in
      # addition to checking the packed tarballs.
      - name: Pack, contract-check, and consumer-test the release tarballs
        run: pnpm run artifacts:pack

      - name: Generate SPDX SBOMs for the packed tarballs
        run: node tooling/scripts/generate-release-sbom.mjs

      - name: Snapshot the npm dist-tags before publishing
        run: node tooling/scripts/npm-release-state.mjs --snapshot --registry "$NPM_REGISTRY"

      - name: Upload the release evidence artifact (90-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ steps.version.outputs.version }}
          path: tooling/artifacts/
          retention-days: 90
          if-no-files-found: error

      # Trusted publishing: no NODE_AUTH_TOKEN — npm exchanges the GitHub
      # OIDC token under id-token: write. Access and the channel's dist-tag
      # ride on the publish invocation itself; the trusted-publishing identity
      # cannot mutate dist-tags after the fact, so drift fails the run (see
      # the runbook's escalation path). An already-present version with the
      # packed payload and the correct tag is a tokenless idempotent no-op.
      # Success means Accepted only; visibility is the converge step's job.
      - name: Publish the tested tarballs to npmjs
        id: publish
        env:
          RELEASE_NPM_TAG: ${{ steps.version.outputs.npm-tag }}
        run: bash tooling/scripts/publish-npm-packages.sh --npm-tag "$RELEASE_NPM_TAG"

      - name: Wait until the version is Visible (bounded convergence gate)
        id: converge
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NPM_TAG: ${{ steps.version.outputs.npm-tag }}
        run: node tooling/scripts/wait-for-npm-packages.mjs --version "$RELEASE_VERSION" --npm-tag "$RELEASE_NPM_TAG" --registry "$NPM_REGISTRY"

      - name: Verify the npm dist-tags (fail closed on drift)
        id: dist-tags
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NPM_TAG: ${{ steps.version.outputs.npm-tag }}
        run: |
          ARGS=(--verify --snapshot-file tooling/artifacts/npm-release-state.json --npm-tag "$RELEASE_NPM_TAG" --version "$RELEASE_VERSION" --registry "$NPM_REGISTRY")
          if [ "$RELEASE_NPM_TAG" != "latest" ]; then
            ARGS+=(--protect-latest)
          fi
          node tooling/scripts/npm-release-state.mjs "${ARGS[@]}"

      - name: Run the registry-mode consumer test
        id: registry-test
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node tooling/scripts/test-release-package-consumers.mjs --registry "$NPM_REGISTRY" --version "$RELEASE_VERSION"

      # Classifies the run from the step outcomes (read through env only):
      # the first failing stage decides — see the header comment.
      - name: Write the publication summary
        if: always()
        env:
          RELEASE_CHANNEL: ${{ steps.context.outputs.channel }}
          RELEASE_BRANCH: ${{ steps.context.outputs.branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NPM_TAG: ${{ steps.version.outputs.npm-tag }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          CONVERGE_OUTCOME: ${{ steps.converge.outcome }}
          DIST_TAGS_OUTCOME: ${{ steps.dist-tags.outcome }}
          REGISTRY_TEST_OUTCOME: ${{ steps.registry-test.outcome }}
        run: |
          PACKAGE="@midnight-ntwrk/midnight-vc-passport"
          if [ "$PUBLISH_OUTCOME" != "success" ]; then
            OUTCOME="Rejected"
            case "$PUBLISH_OUTCOME" in
              failure) DETAIL="npm publish failed or the registry preflight refused the version; nothing is claimed to exist on the registry" ;;
              cancelled) DETAIL="the publish step was cancelled; its result is uncertain, so inspect the registry" ;;
              *) DETAIL="not attempted: the run stopped before the publish step (${PUBLISH_OUTCOME:-no outcome})" ;;
            esac
          elif [ "$CONVERGE_OUTCOME" != "success" ]; then
            OUTCOME="Accepted, propagation timed out"
            DETAIL="npm publish reported success, but the version was not Visible within the convergence budget (converge: ${CONVERGE_OUTCOME:-no outcome}); the version may still appear on the registry"
          elif [ "$DIST_TAGS_OUTCOME" != "success" ] || [ "$REGISTRY_TEST_OUTCOME" != "success" ]; then
            OUTCOME="Visible, verification failed"
            DETAIL="the version is Visible, but downstream verification failed (dist-tags: ${DIST_TAGS_OUTCOME:-no outcome}, registry consumer test: ${REGISTRY_TEST_OUTCOME:-no outcome})"
          else
            OUTCOME="Verified"
            DETAIL="published: Visible, dist-tags verified, and the registry consumer test passed"
          fi
          {
            echo "## Publication summary"
            echo ""
            echo "- outcome: **$OUTCOME** — $DETAIL"
            echo "- channel: \`$RELEASE_CHANNEL\`"
            echo "- branch: \`$RELEASE_BRANCH\`"
            echo "- version: \`${RELEASE_VERSION:-<unresolved>}\`"
            echo "- dist-tag: \`${RELEASE_NPM_TAG:-<unresolved>}\`"
            echo "- registry: \`${NPM_REGISTRY}\`"
            echo "- authentication: npm trusted publishing (OIDC via the \`npm-release\` environment)"
            if [ "$OUTCOME" != "Verified" ]; then
              echo ""
              echo "### Before retrying"
              echo ""
              echo "- Versions are immutable: a version the registry has accepted can never be replaced."
              echo "- Inspect the registry before re-dispatching: \`npm view $PACKAGE@${RELEASE_VERSION:-<version>} --json\`."
              echo "- A re-dispatch never republishes an existing version: re-dispatching the same inputs for a Visible version is a no-op that completes verification."
              echo "- See docs/guides/npmjs-publication.md, \"Retry and rollback\"."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
