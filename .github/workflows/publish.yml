name: Publish

# The release train for the digital-passport family package
# (npm-publication + github-release-distribution specs). Manually dispatched
# only — no push, pull_request, or schedule trigger may ever start a
# publication. The channel/branch gate runs first and fails the run before
# any build step:
#   - rc:        develop or main
#   - release:   main only
#   (snapshot fails closed during the GitHub-Release window: run-number-
#   stamped versions cannot be pre-tagged by an operator)
#
# WINDOW (temporary): GitHub-Release distribution coexists with the npmjs
# path while the npmjs Trusted Publisher mapping is not configured. The
# operator creates and pushes the release tag (v<version>) on the release
# commit and supplies it as the `tag` input; the run reconciles it before any
# build step (exists, points at the dispatch commit, equals v<resolved
# version>). After the gate, pack, and SBOM steps, the run creates the GitHub
# release (prerelease for rc, latest for release) with the tarball +
# SHA256SUMS + SBOM + contract report, verifies the uploaded digests, attests
# the assets, and consumer-tests the package from the release URL — all
# before the npmjs publication, which is then attempted best-effort: a failed
# attempt leaves the run green and the Release intact, skips the downstream
# registry steps, and is recorded in the run summary. Exit procedure: see
# docs/guides/npmjs-publication.md, "GitHub-Release distribution window".
#
# Authentication is npm Trusted Publishing: the publish job runs inside the
# protected `npm-release` GitHub environment with `id-token: write`; npm
# (>= 11.5.1) exchanges the GitHub Actions OIDC token for a short-lived
# publish token when the npmjs-side Trusted Publisher mapping matches
# (organization midnightntwrk, repository midnight-vc-passport,
# workflow filename publish.yml, environment npm-release).
# No npm token secret exists — see docs/guides/npmjs-publication.md for the
# trusted-publisher prerequisites. The workflow filename must stay
# `publish.yml`: it is part of the npmjs Trusted Publisher mapping.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - snapshot
          - rc
          - release
        required: true
      tag:
        description: "Release tag (v<version>) the operator created on the dispatched commit; must match the resolved channel version"
        type: string
        required: true
      version:
        description: "Base semantic version; must match the root and package manifests (optional confirmation)"
        type: string
        required: false
      rc_index:
        description: "Release candidate index (rc channel only; defaults to 1)"
        type: string
        required: false

# WINDOW (temporary): contents: write creates the GitHub release and uploads
# its assets, attestations: write stores the build-provenance attestations,
# and id-token: write is both the npm trusted-publishing OIDC identity and the
# attestation/provenance signer. The window-exit change restores
# contents: read + id-token: write.
permissions:
  contents: write
  id-token: write
  attestations: write

# A publication must never be cancelled mid-flight by a newer dispatch.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPACT_COMPILER_VERSION: 0.31.1
  NPM_REGISTRY: https://registry.npmjs.org/
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"

jobs:
  publish:
    name: Gate, pack, publish the GitHub release, and attempt npmjs
    runs-on: ubuntu-24.04
    # Human gate + branch allow-list for the trusted-publishing identity.
    environment: npm-release
    timeout-minutes: 60
    permissions:
      contents: write # WINDOW: create the GitHub release and upload its assets
      id-token: write # npm trusted-publishing OIDC identity + provenance/attestation signer
      attestations: write # WINDOW: store the build-provenance attestations
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the tag reconciliation step resolves the
          # operator tag (refs/tags/<tag>) with a local git rev-parse, and the
          # default shallow clone carries no tags at all.
          fetch-depth: 0

      - name: Resolve publication context (dispatch-only, channel/branch gate)
        id: context
        env:
          # Free-form workflow_dispatch inputs must never be interpolated into
          # the run: script via ${{ }} (shell-injection risk); env values are
          # never parsed as shell syntax.
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_RC_INDEX: ${{ inputs.rc_index }}
        run: bash tooling/scripts/release-resolve-context.sh --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION" --rc-index "$RELEASE_RC_INDEX"

      # WINDOW (temporary): the operator-owned release tag is reconciled
      # immediately after the gate — before tool setup and the expensive
      # repository gate — so tag/commit/version drift fails the run within
      # seconds. The workflow never creates, moves, or deletes any ref.
      - name: Reconcile the operator release tag (window; fail closed on drift)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ steps.context.outputs.channel }}
          RELEASE_RC_INDEX: ${{ steps.context.outputs.rc-index }}
          RELEASE_BASE_VERSION: ${{ steps.context.outputs.base-version }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          ARGS=(--tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL" --sha "$DISPATCH_SHA")
          if [ -n "$RELEASE_RC_INDEX" ]; then
            ARGS+=(--rc-index "$RELEASE_RC_INDEX")
          fi
          if [ -n "$RELEASE_BASE_VERSION" ]; then
            ARGS+=(--base-version "$RELEASE_BASE_VERSION")
          fi
          node tooling/scripts/verify-release-tag.mjs "${ARGS[@]}"

      - name: Set up Node.js, pnpm, and Compact
        uses: ./.github/actions/setup-node-pnpm
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}
          github-token: ${{ github.token }}
          registry-url: ${{ env.NPM_REGISTRY }}

      - name: Check the npm CLI supports trusted publishing (OIDC path)
        run: |
          npm --version
          node -e 'const v = require("child_process").execSync("npm --version").toString().trim(); const m = /^(\d+)\.(\d+)\.(\d+)/.exec(v); const p = m ? m.slice(1).map(Number) : [0, 0, 0]; const tooOld = p[0] < 11 || (p[0] === 11 && p[1] < 5) || (p[0] === 11 && p[1] === 5 && p[2] < 1); if (!m || tooOld) { throw new Error("npm " + v + " predates trusted-publishing support (needs >= 11.5.1)"); } console.log("npm CLI " + v + " supports trusted publishing");'

      - name: Run the repository gate (security checks, lint, typecheck, build, tests, release tooling)
        run: pnpm run all

      - name: Run the consumer smoke round-trip
        run: pnpm run smoke

      - name: Prepare the release version (stateless; never committed back)
        id: version
        env:
          # Outputs flow through env (never ${{ }} inside run:) so no future
          # validator regression can turn them into shell syntax.
          RELEASE_CHANNEL: ${{ steps.context.outputs.channel }}
          RELEASE_RC_INDEX: ${{ steps.context.outputs.rc-index }}
          RELEASE_BASE_VERSION: ${{ steps.context.outputs.base-version }}
        run: |
          ARGS=(--channel "$RELEASE_CHANNEL")
          if [ -n "$RELEASE_RC_INDEX" ]; then
            ARGS+=(--rc-index "$RELEASE_RC_INDEX")
          fi
          if [ -n "$RELEASE_BASE_VERSION" ]; then
            ARGS+=(--version "$RELEASE_BASE_VERSION")
          fi
          node tooling/scripts/prepare-release-version.mjs "${ARGS[@]}"

      # Emits the machine-readable contract report into tooling/artifacts/ in
      # addition to checking the packed tarballs.
      - name: Pack, contract-check, and consumer-test the release tarballs
        run: pnpm run artifacts:pack

      - name: Generate SPDX SBOMs for the packed tarballs
        run: node tooling/scripts/generate-release-sbom.mjs

      - name: Snapshot the npm dist-tags before publishing
        run: node tooling/scripts/npm-release-state.mjs --snapshot --registry "$NPM_REGISTRY"

      - name: Upload the release evidence artifact (90-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ steps.version.outputs.version }}
          path: tooling/artifacts/
          retention-days: 90
          if-no-files-found: error

      # WINDOW (temporary): SHA256SUMS over the tarball(s), SBOM(s), and the
      # contract report, plus the generated release body (channel, version,
      # install URL, checksums, verification one-liners, changelog link).
      - name: Generate the release checksums and body (window)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ steps.context.outputs.channel }}
        run: node tooling/scripts/publish-github-release.mjs prepare --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL" --repo "$GITHUB_REPOSITORY"

      # WINDOW (temporary): creates the release on the operator tag (never
      # moving it) with every asset — prerelease for rc (never latest),
      # latest for release — or turns a rerun into a verified no-op; any
      # digest drift fails closed (never --clobber). GH_TOKEN flows only
      # through the env map.
      - name: Create the GitHub release and verify the uploaded digests (window)
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ steps.context.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: node tooling/scripts/publish-github-release.mjs publish --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL" --repo "$GITHUB_REPOSITORY"

      # WINDOW (temporary): build-provenance attestations for every uploaded
      # asset, by sha256 digest.
      - name: Attest the release assets (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            tooling/artifacts/npm/*.tgz
            tooling/artifacts/sbom/*.spdx.json
            tooling/artifacts/contract-report.json
            tooling/artifacts/SHA256SUMS

      # WINDOW (temporary): clean-consumer install from the just-created
      # release's download URL — the exact path window consumers use.
      - name: Run the release-URL consumer test (window)
        env:
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
        run: node tooling/scripts/test-release-package-consumers.mjs --release-url "$RELEASE_URL"

      # Trusted publishing: no NODE_AUTH_TOKEN — npm exchanges the GitHub
      # OIDC token under id-token: write. Access and the channel's dist-tag
      # ride on the publish invocation itself; the trusted-publishing identity
      # cannot mutate dist-tags after the fact, so drift fails the run (see
      # the runbook's escalation path). An already-published version with the
      # correct tag is a tokenless idempotent no-op.
      #
      # WINDOW (temporary): best-effort — the GitHub release above is the
      # interim channel, so a failed attempt (e.g. npm E404 while the Trusted
      # Publisher mapping is absent) leaves the job green; the registry steps
      # below run only when this step succeeded, and the outcome is recorded
      # in the run summary. The window-exit change removes continue-on-error
      # and the step guards.
      - name: Publish the tested tarballs to npmjs (best-effort during the window)
        id: publish
        continue-on-error: true
        env:
          RELEASE_NPM_TAG: ${{ steps.version.outputs.npm-tag }}
        run: bash tooling/scripts/publish-npm-packages.sh --npm-tag "$RELEASE_NPM_TAG"

      - name: Wait for registry propagation
        if: steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NPM_TAG: ${{ steps.version.outputs.npm-tag }}
        run: node tooling/scripts/wait-for-npm-packages.mjs --version "$RELEASE_VERSION" --npm-tag "$RELEASE_NPM_TAG" --registry "$NPM_REGISTRY"

      - name: Verify the npm dist-tags (fail closed on drift)
        if: steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NPM_TAG: ${{ steps.version.outputs.npm-tag }}
        run: |
          ARGS=(--verify --snapshot-file tooling/artifacts/npm-release-state.json --npm-tag "$RELEASE_NPM_TAG" --version "$RELEASE_VERSION" --registry "$NPM_REGISTRY")
          if [ "$RELEASE_NPM_TAG" != "latest" ]; then
            ARGS+=(--protect-latest)
          fi
          node tooling/scripts/npm-release-state.mjs "${ARGS[@]}"

      - name: Run the registry-mode consumer test
        if: steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node tooling/scripts/test-release-package-consumers.mjs --registry "$NPM_REGISTRY" --version "$RELEASE_VERSION"

      - name: Write the release summary
        if: always()
        env:
          RELEASE_CHANNEL: ${{ steps.context.outputs.channel }}
          RELEASE_BRANCH: ${{ steps.context.outputs.branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NPM_TAG: ${{ steps.version.outputs.npm-tag }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
          NPM_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          case "$NPM_PUBLISH_OUTCOME" in
            success) NPM_RESULT="published (registry verification ran)" ;;
            failure) NPM_RESULT="failed — tolerated during the GitHub-Release window; registry steps skipped" ;;
            *) NPM_RESULT="not attempted (${NPM_PUBLISH_OUTCOME:-run stopped earlier})" ;;
          esac
          {
            echo "## Publication summary"
            echo ""
            echo "- channel: \`$RELEASE_CHANNEL\`"
            echo "- branch: \`$RELEASE_BRANCH\`"
            echo "- version: \`$RELEASE_VERSION\`"
            echo "- tag: \`$RELEASE_TAG\`"
            echo "- GitHub release asset (interim channel): \`$RELEASE_URL\`"
            echo "- npm tag: \`$RELEASE_NPM_TAG\`"
            echo "- npm publication (best-effort): $NPM_RESULT"
            echo "- registry: \`${NPM_REGISTRY}\`"
            echo "- authentication: npm trusted publishing (OIDC via the \`npm-release\` environment)"
          } >> "$GITHUB_STEP_SUMMARY"
