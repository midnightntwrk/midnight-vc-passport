name: Set up Node, pnpm, and optional Compact
description: >-
  Shared CI setup for this repository: enables Corepack/pnpm, installs Node.js
  with the pnpm store cache, optionally installs the Compact compiler (pinned by
  the workflow env), and optionally runs `pnpm install`. Mirrors the midnight-did
  composite-action precedent, trimmed to this repository's lanes.

inputs:
  compact-version:
    description: Compact compiler version to install. Leave empty to skip Compact setup.
    required: false
    default: ""
  github-token:
    description: GitHub token for authenticated Compact toolchain downloads.
    required: false
    default: ""
  install:
    description: Run `pnpm install` after tool setup.
    required: false
    default: "true"
  install-args:
    description: Arguments passed to `pnpm install`.
    required: false
    default: --frozen-lockfile --prefer-offline
  registry-url:
    description: >-
      Optional npm registry URL for actions/setup-node. When set, setup-node
      writes the .npmrc registry entry with an expanded ${NODE_AUTH_TOKEN}
      placeholder, so publication steps authenticate through the environment
      instead of arguments or files containing secrets.
    required: false
    default: ""
  node-version-file:
    description: File containing the Node version for actions/setup-node.
    required: false
    default: .nvmrc
  verify-compact:
    description: Verify the Compact installation when compact-version is set.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node.js with pnpm cache
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}

    - name: Set up Compact toolchain
      if: inputs.compact-version != ''
      uses: midnightntwrk/setup-compact-action@43f89f99939f716f68c1c56b2a12bba044407bfd # ratchet:midnightntwrk/setup-compact-action@v1
      with:
        compact-version: ${{ inputs.compact-version }}
        github-token: ${{ inputs.github-token }}

    - name: Verify Compact installation
      if: inputs.compact-version != '' && inputs.verify-compact == 'true'
      shell: bash
      run: compact compile --version

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: pnpm install ${INSTALL_ARGS}
